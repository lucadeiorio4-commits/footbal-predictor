
name: Aggiorna dati calcistici

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  aggiorna:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Scarica e unisci campionato e coppe
        run: |
          python - <<'PY'
          import json
          import urllib.request
          from pathlib import Path
          from datetime import datetime, timezone

          headers = {
              "User-Agent": "Football-Predictor-AI"
          }

          sources = [
              {
                  "nome": "Serie A",
                  "tipo": "openfootball",
                  "url": (
                      "https://raw.githubusercontent.com/"
                      "openfootball/football.json/master/"
                      "2026-27/it.1.json"
                  )
              },
              {
                  "nome": "Champions League",
                  "tipo": "fixture",
                  "url": (
                      "https://fixturedownload.com/feed/json/"
                      "champions-league-2026"
                  )
              },
              {
                  "nome": "Europa League",
                  "tipo": "fixture",
                  "url": (
                      "https://fixturedownload.com/feed/json/"
                      "europa-league-2026"
                  )
              },
              {
                  "nome": "Conference League",
                  "tipo": "fixture",
                  "url": (
                      "https://fixturedownload.com/feed/json/"
                      "conference-league-2026"
                  )
              }
          ]

          tutte = []

          for source_info in sources:
              req = urllib.request.Request(
                  source_info["url"],
                  headers=headers
              )

              with urllib.request.urlopen(
                  req, timeout=45
              ) as response:
                  source = json.load(response)

              partite = []

              if source_info["tipo"] == "openfootball":
                  for match in source.get("matches", []):
                      score = match.get("score") or {}
                      ft = score.get("ft")
                      valida = (
                          isinstance(ft, list)
                          and len(ft) == 2
                          and all(
                              isinstance(x, int) and not isinstance(x, bool)
                              for x in ft
                          )
                      )

                      partite.append({
                          "campionato": source_info["nome"],
                          "giornata": match.get("round", ""),
                          "data": match.get("date", ""),
                          "ora": match.get("time", ""),
                          "casa": match.get("team1", ""),
                          "ospite": match.get("team2", ""),
                          "risultatoCasa": ft[0] if valida else None,
                          "risultatoOspite": ft[1] if valida else None
                      })

              else:
                  if not isinstance(source, list):
                      raise RuntimeError(
                          "Formato JSON inatteso per "
                          + source_info["nome"]
                      )

                  for match in source:
                      date_utc = match.get("DateUtc", "")
                      data = date_utc[:10] if date_utc else ""
                      ora = (
                          date_utc[11:16]
                          if len(date_utc) >= 16 else ""
                      )

                      casa_score = match.get("HomeTeamScore")
                      ospite_score = match.get("AwayTeamScore")

                      punteggio_valido = (
                          isinstance(casa_score, int)
                          and not isinstance(casa_score, bool)
                          and isinstance(ospite_score, int)
                          and not isinstance(ospite_score, bool)
                      )

                      partite.append({
                          "campionato": source_info["nome"],
                          "giornata": match.get("RoundNumber", ""),
                          "data": data,
                          "ora": ora,
                          "casa": match.get("HomeTeam", ""),
                          "ospite": match.get("AwayTeam", ""),
                          "risultatoCasa": (
                              casa_score if punteggio_valido else None
                          ),
                          "risultatoOspite": (
                              ospite_score if punteggio_valido else None
                          )
                      })

              if not partite:
                  raise RuntimeError(
                      "Nessuna partita ricevuta per "
                      + source_info["nome"]
                      + ". Aggiornamento annullato."
                  )

              if any(
                  not p["casa"] or not p["ospite"] or not p["data"]
                  for p in partite
              ):
                  raise RuntimeError(
                      "Partite con dati essenziali mancanti in "
                      + source_info["nome"]
                  )

              tutte.extend(partite)

              print(
                  source_info["nome"] + ":",
                  len(partite),
                  "partite"
              )

          # Rimuove eventuali duplicati della stessa competizione.
          viste = set()
          uniche = []

          for partita in tutte:
              chiave = (
                  partita["campionato"],
                  partita["data"],
                  partita["casa"],
                  partita["ospite"]
              )

              if chiave not in viste:
                  viste.add(chiave)
                  uniche.append(partita)

          output = {
              "fonte": "OpenFootball + Fixture Download",
              "campionato": "Competizioni europee e Serie A",
              "ultimoAggiornamento": datetime.now(
                  timezone.utc
              ).isoformat(),
              "numeroPartite": len(uniche),
              "partite": uniche
          }

          # Scrive il file solo dopo aver scaricato e validato
          # tutte le fonti.
          Path("data").mkdir(exist_ok=True)
          Path("data/fixtures.json").write_text(
              json.dumps(output, ensure_ascii=False, indent=2),
              encoding="utf-8"
          )

          print("Totale partite:", len(uniche))
          print("File creato: data/fixtures.json")
          PY

      - name: Verifica dati generati
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/fixtures.json")
          data = json.loads(path.read_text(encoding="utf-8"))

          assert isinstance(data.get("partite"), list)
          assert data["numeroPartite"] == len(data["partite"])
          assert data["numeroPartite"] > 0

          competizioni = sorted({
              p["campionato"] for p in data["partite"]
          })

          print("Verifica completata.")
          print("Partite:", data["numeroPartite"])
          print("Competizioni:", ", ".join(competizioni))

          richieste = {
              "Serie A",
              "Champions League",
              "Europa League",
              "Conference League"
          }

          mancanti = richieste - set(competizioni)

          if mancanti:
              raise RuntimeError(
                  "Competizioni mancanti: "
                  + ", ".join(sorted(mancanti))
              )
          PY

      - name: Salva dati nel repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fixtures.json
          if git diff --cached --quiet; then
            echo "Nessuna modifica ai dati."
          else
            git commit -m "Aggiorna campionati e coppe europee"
            git push
          fi
