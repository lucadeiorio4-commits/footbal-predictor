
name: Aggiorna dati calcistici

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */12 * * *"

permissions:
  contents: write

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scarica partite da API-Football
        env:
          API_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          python - <<'PY'
          import os, json, urllib.request, urllib.parse
          from datetime import date, timedelta
          from pathlib import Path

          key = os.environ.get("API_KEY")
          if not key:
              raise SystemExit("API Key non configurata")

          oggi = date.today()
          fine = oggi + timedelta(days=7)

          campionati = {
              39: "Premier League",
              140: "La Liga",
              135: "Serie A",
              78: "Bundesliga",
              61: "Ligue 1",
              2: "Champions League",
              3: "Europa League"
          }

          partite = []
          errori = []

          for league_id, nome in campionati.items():
              params = urllib.parse.urlencode({
                  "league": league_id,
                  "season": oggi.year,
                  "from": oggi.isoformat(),
                  "to": fine.isoformat()
              })
              req = urllib.request.Request(
                  "https://v3.football.api-sports.io/fixtures?" + params,
                  headers={"x-apisports-key": key}
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      dati = json.loads(r.read().decode("utf-8"))

                  if dati.get("errors"):
                      errori.append(nome + ": errore API")
                      continue

                  for p in dati.get("response", []):
                      partite.append({
                          "id": p["fixture"]["id"],
                          "data": p["fixture"]["date"],
                          "stato": p["fixture"]["status"]["short"],
                          "campionato": nome,
                          "casa": p["teams"]["home"]["name"],
                          "trasferta": p["teams"]["away"]["name"],
                          "golCasa": p["goals"]["home"],
                          "golTrasferta": p["goals"]["away"]
                      })
              except Exception as e:
                  errori.append(nome + ": " + str(e))

          cartella = Path("data")
          cartella.mkdir(exist_ok=True)
          risultato = {
              "aggiornato": oggi.isoformat(),
              "numeroPartite": len(partite),
              "partite": partite,
              "avvisi": errori
          }
          (cartella / "fixtures.json").write_text(
              json.dumps(risultato, ensure_ascii=False, indent=2),
              encoding="utf-8"
          )
          print("Partite salvate:", len(partite))
          print("Avvisi:", len(errori))
          PY

      - name: Salva dati nel repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fixtures.json
          git diff --cached --quiet || git commit -m "Aggiorna partite"
          git push
